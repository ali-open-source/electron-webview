<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Index Page</title>
  </head>
  <body>
    <h1>Index Page</h1>
    <button id="displayVersionBtn">Display Version Info</button>
    <div id="versionInfo" style="margin-top: 20px;"></div>
    <div class="system-info">
        <h2>System Information</h2>
        <div id="platform"></div>
        <div id="architecture"></div>
        <div id="userInfo"></div>
        <div id="homeDir"></div>
        <div id="tempDir"></div>
    </div>

    <script>
      document.getElementById('displayVersionBtn')
        .addEventListener('click', () => {
          // Display the versions using Node's process.versions
          versionInfoDiv.innerHTML = `
            <p><strong>Node.js Version:</strong> ${window.process.versions.node}</p>
            <p><strong>Electron Version:</strong> ${window.process.versions.electron}</p>
          `;
        });
        const versionInfoDiv = document.getElementById('versionInfo');
          // Display the versions using Node's process.versions
          versionInfoDiv.innerHTML = `
            <p><strong>Node.js Version:</strong> ${window.process.versions.node}</p>
            <p><strong>Electron Version:</strong> ${window.process.versions.electron}</p>
          `;
            const os = require('os');
            document.getElementById('userInfo').innerHTML = `<strong>Username:</strong> ${os.userInfo().username}`;
            document.getElementById('homeDir').innerHTML = `<strong>Home Directory:</strong> ${os.homedir()}`;
            document.getElementById('tempDir').innerHTML = `<strong>Temp Directory:</strong> ${os.tmpdir()}`;

    </script>
  </body>
</html>
