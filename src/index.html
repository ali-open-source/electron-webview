<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Main Page</title>
  </head>
  <body>
    <h1>Main Page</h1>
    <p>This page loads a webview by default. The guest page (index.html) includes a button to show version info.</p>
    <!-- The webview loads index.html on startup -->
    <webview id="myWebview"
             src="node-integration.html"
             style="width: 100%; height: 80vh;"
             nodeintegration nodeintegrationinsubframes webpreferences="allowRunningInsecureContent=true, nodeintegration=true, contextIsolation=false, enableRemoteModule=true, nodeintegrationinsubframes">
    </webview>
    <webview id="myWebview"
             src="node-integration.html"
             style="width: 100%; height: 80vh;"
             nodeintegration nodeintegrationinsubframes webpreferences="allowRunningInsecureContent=true, nodeintegration=true, contextIsolation=false, enableRemoteModule=true, nodeintegrationinsubframes">
    </webview>
    <webview id="myWebview"
             src="node-integration.html"
             style="width: 100%; height: 80vh;"
             nodeintegration nodeintegrationinsubframes webpreferences="allowRunningInsecureContent=true, nodeintegration=true, contextIsolation=false, enableRemoteModule=true, nodeintegrationinsubframes">
    </webview>
  </body>
  <script>

const webview = document.querySelector('webview')
        webview.addEventListener('dom-ready', () => {
        webview.openDevTools()
        // Enable Node integration in the webview
        webview.setAttribute('nodeintegration', 'true');
        webview.setAttribute('nodeintegrationinsubframes', 'true');
        webview.setAttribute('webpreferences', 'contextIsolation=false, enableRemoteModule=true');
        webview.addEventListener('console-message', (e) => {
          console.log(`Guest page logged a message: ${e.message}`);
        });
        webview.addEventListener('did-finish-load', () => {
          console.log('Webview finished loading.');
        });
})
  </script>
</html>
