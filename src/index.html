<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Electron WebView Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #45a049;
        }
        #webview-container {
            width: 100%;
            height: 600px;
            border: 1px solid #ccc;
            border-radius: 5px;
            overflow: hidden;
            background-color: #fff;
            display: none; /* Initially hidden */
        }
        webview {
            width: 100%;
            height: 100%;
            display: inline-flex;
        }
        .controls {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Electron WebView with Node Integration</h1>
        <p>This example demonstrates how to load an HTML file with Node.js integration enabled using the WebView tag.</p>
        
        <div class="controls">
            <button id="loadButton">Load Node Integration Page</button>
            <button id="hideButton" disabled>Hide WebView</button>
        </div>
        
        <div id="webview-container">
            <!-- The WebView tag will be created dynamically -->
            <webview src="./node-integration.html" nodeintegrationinsubframes nodeintegration preload="./preload.js"></webview>
        </div>
    </div>

    <script>
        // Since we have Node integration enabled in the main window, we can use require directly
        const path = require('path');
        
        const loadButton = document.getElementById('loadButton');
        const hideButton = document.getElementById('hideButton');
        const webviewContainer = document.getElementById('webview-container');
        
        //let webview = null;
        
        loadButton.addEventListener('click', () => {


          const webview = document.querySelector('webview')
          webview.addEventListener('dom-ready', () => {
            console.log('WebView DOM ready');
            webview.openDevTools()
          })
          webview.addEventListener('console-message', (event) => {
                    console.log('WebView console:', event.message);
                });
            // // Show the webview container
            webviewContainer.style.display = 'block';
            
            // // If webview doesn't exist yet, create it
            if (webview) {
                //webview = document.createElement('webview');
                webview.openDevTools();
                // Set attributes for the webview
                webview.nodeintegration = true; // Enable Node integration
                webview.nodeintegrationinsubframes = true; // Enable Node integration in subframes
                //webview.src = path.join('file://', __dirname, 'node-integration.html');
                webview.preload = path.join(__dirname, 'preload.js');
                
                // Add webview to the container
                //webviewContainer.appendChild(webview);
                
                // Listen for webview events
                webview.addEventListener('dom-ready', () => {
                    console.log('WebView DOM ready');
                    // Uncomment to open DevTools for the webview
                    webview.openDevTools();
                    webview.nodeintegration = true; // Enable Node integration
                    webview.nodeintegrationinsubframes = true; // Enable Node integration in subframes
                });
                
                webview.addEventListener('console-message', (event) => {
                    console.log('WebView console:', event.message);
                });
            }
            
            // Update button states
            loadButton.disabled = true;
            hideButton.disabled = false;
        });
        
        hideButton.addEventListener('click', () => {
            // Hide the webview container
            webviewContainer.style.display = 'none';
            
            // Update button states
            loadButton.disabled = false;
            hideButton.disabled = true;
        });
    </script>
</body>
</html>
